<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Palestra Solve</title>
<style>
:root{--bg:#e9eeec;--surface:#f8faf9;--ink:#12211f;--muted:#566864;--line:#c7d2ce;--accent:#0d5f6e;--on:#fff;--bad:#b0352d}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;--bg:#0e1615;--surface:#162120;--ink:#e4ebe8;--muted:#91a39e;--line:#2a3a37;--accent:#5fc0cf;--on:#06201f;--bad:#ee7d74}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:16px}
form{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:8px;padding:28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:1.5rem}p{margin:0;color:var(--muted);font-size:.92rem}
label{font-weight:600;font-size:.9rem}
input[type=password]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--muted)}
button{font:600 1rem system-ui,sans-serif;padding:11px;border:0;border-radius:6px;background:var(--accent);color:var(--on);cursor:pointer}
button:disabled{opacity:.6}
#err{color:var(--bad);min-height:1.2em;font-size:.9rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<form id="f" autocomplete="off">
<h1>Palestra Solve</h1>
<p>Sito privato. Inserisci la password per entrare.</p>
<label for="pw">Password</label>
<input type="password" id="pw" autofocus required>
<label class="chk"><input type="checkbox" id="rem"> Ricordami su questo dispositivo</label>
<button id="go">Entra</button>
<div id="err" role="alert"></div>
</form>

  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,256))}
async function dec(raw){const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c)))}
function show(html){document.open();document.write(html);document.close()}
(async()=>{let s=null;try{s=localStorage.getItem(K)}catch(_){}if(!s)return;try{const html=await dec(u(s));if(document.readyState!=='complete')await new Promise(r=>addEventListener('load',r,{once:true}));show(html)}catch(e){try{localStorage.removeItem(K)}catch(_){}}})();
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('go'),err=document.getElementById('err'),rem=document.getElementById('rem').checked;
  b.disabled=true;err.textContent='';let html;
  try{const raw=await derive(document.getElementById('pw').value);html=await dec(raw);
    if(rem){try{localStorage.setItem(K,btoa(String.fromCharCode(...raw)))}catch(_){}}}
  catch(x){err.textContent='Password non corretta. Riprova.';b.disabled=false;return}
  show(html)});
</script>
