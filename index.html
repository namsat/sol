<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palestra Solve</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: a field-station logbook. One working column, a sticky instrument bar with a large mono clock, each game owns one colour. */
  --bg:#e9eeec; --surface:#f8faf9; --sunk:#dfe6e3; --ink:#12211f; --muted:#566864; --line:#c7d2ce;
  --accent:#0d5f6e; --on-accent:#ffffff;
  --rust:#a4472a; --sea:#0d5f6e; --moss:#4c7428; --slate:#4a4f6a;
  --good:#23764a; --warn:#a86a10; --bad:#b0352d;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1615; --surface:#162120; --sunk:#0a1110; --ink:#e4ebe8; --muted:#91a39e; --line:#2a3a37;
    --accent:#5fc0cf; --on-accent:#06201f;
    --rust:#e08a6c; --sea:#5fc0cf; --moss:#9cc86e; --slate:#a3a9d6;
    --good:#5fc48d; --warn:#e0aa4a; --bad:#ee7d74;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1615; --surface:#162120; --sunk:#0a1110; --ink:#e4ebe8; --muted:#91a39e; --line:#2a3a37;
  --accent:#5fc0cf; --on-accent:#06201f;
  --rust:#e08a6c; --sea:#5fc0cf; --moss:#9cc86e; --slate:#a3a9d6;
  --good:#5fc48d; --warn:#e0aa4a; --bad:#ee7d74;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2rem,5.2vw,3.5rem);font-weight:800}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 72px;display:flex;flex-direction:column;gap:24px}
.muted{color:var(--muted)} .small{font-size:.875rem} .n,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.m-rr{--m:var(--rust)} .m-sw{--m:var(--sea)} .m-sf{--m:var(--moss)} .m-dr{--m:var(--slate)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:6px;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.big{padding:14px 22px;font-size:1.05rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:12px}
.card.m{border-top:4px solid var(--m)}
.tag{font:600 .72rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--m,var(--muted))}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
/* home */
.masthead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.brand{font:800 1.15rem var(--display)}
.hero{display:flex;flex-direction:column;gap:20px}
.hero p.lead{max-width:62ch;font-size:1.1rem;color:var(--muted)}
.track{display:flex;gap:3px;border-radius:8px;overflow:hidden}
.seg{background:var(--m);color:var(--on-accent);padding:14px 14px 12px;min-width:0;display:flex;flex-direction:column;gap:2px}
.seg b{font:800 1.9rem/1 var(--display)} .seg span{font-size:.85rem;font-weight:600}
.seg small{font:400 .72rem var(--mono);opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.segctl{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.segctl button{border:0;background:transparent;padding:8px 14px;font-weight:600;font-size:.9rem;border-right:1px solid var(--line)}
.segctl button:last-child{border-right:0}
.segctl button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:120px 1fr 52px;gap:12px;align-items:center;font-size:.9rem}
.bar{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--m,var(--accent));border-radius:5px}
/* play */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--m);padding:10px 0;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.clock{font:600 2rem/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.clock.warn{color:var(--warn)} .clock.crit{color:var(--bad)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font:600 .72rem var(--mono);padding:4px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.steps span.on{background:var(--m);border-color:var(--m);color:var(--on-accent)}
.steps span.done{color:var(--ink)}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.m-sw .two{grid-template-columns:minmax(0,.62fr) minmax(0,1.38fr)}
.m-sw th,.m-sw td{padding-left:7px;padding-right:7px}
@media (max-width:800px){.two{grid-template-columns:1fr}}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td.n,th.n{text-align:right}
thead th{font:600 .72rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
tbody th{font-weight:600}
.dp{font:600 .92rem var(--mono);border:1px dashed var(--line);background:transparent;border-radius:4px;padding:1px 6px}
.dp:hover{border-color:var(--m)} .dp.on{background:var(--m);color:var(--on-accent);border:1px solid var(--m)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;border:1px solid var(--line);border-radius:4px;padding:3px 8px;background:var(--sunk)}
.chip b{font-family:var(--mono)}
.q{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.q label,.q .ql{font-weight:500;max-width:65ch}
input[type=text],select{font:600 1rem var(--mono);padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:160px;max-width:100%}
select{font-family:var(--body);width:auto}
.opt{display:flex;flex-direction:column;gap:8px}
.opt button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:10px 12px}
.opt button[aria-pressed="true"]{border-color:var(--m);box-shadow:inset 4px 0 0 var(--m);font-weight:600}
.note{border-left:4px solid var(--m,var(--accent));background:var(--sunk);padding:10px 12px;font-size:.9rem;border-radius:0 6px 6px 0}
.pill{display:inline-block;font:600 .72rem var(--mono);padding:3px 8px;border-radius:99px;border:1px solid currentColor}
.pill.ok{color:var(--good)} .pill.no{color:var(--bad)} .pill.mid{color:var(--warn)}
tr.sel{background:var(--sunk);box-shadow:inset 4px 0 0 var(--m)}
tr.clk{cursor:pointer}
.mic{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.mic button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.mic button:hover{border-color:var(--m)}
.mic .v{display:flex;justify-content:space-between;font-size:.85rem}
.tok{font:600 1rem var(--mono)}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:10px 12px;min-width:92px}
.scale button[aria-pressed="true"]{background:var(--m);color:var(--on-accent);border-color:var(--m)}
svg text{fill:var(--muted);font:11px var(--mono)} svg .g{stroke:var(--line)} svg .b{fill:var(--m,var(--accent))}
/* results */
.score{font:800 clamp(3.5rem,11vw,6.5rem)/.9 var(--display);font-variant-numeric:tabular-nums}
.score small{font-size:.3em;color:var(--muted);font-weight:500}
.brk{display:grid;grid-template-columns:minmax(120px,220px) 1fr 70px;gap:10px;align-items:center;font-size:.9rem}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600}
ul.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;max-width:70ch}
td.wrapc{white-space:normal;min-width:220px}
/* calculator */
#calc{position:fixed;right:16px;bottom:16px;width:250px;background:var(--surface);border:1px solid var(--ink);border-radius:8px;padding:12px;display:none;flex-direction:column;gap:8px;z-index:10;box-shadow:0 8px 28px rgba(0,0,0,.25)}
#calc.open{display:flex}
#calc input{width:100%}
#calc .out{font:600 1.2rem var(--mono);text-align:right;min-height:1.6em;overflow-wrap:anywhere}
#calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
#calc .keys button{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:8px 0;font:600 .95rem var(--mono)}
footer{font-size:.8rem;color:var(--muted);max-width:75ch}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .5s ease}}

th.c,td.c{text-align:center;padding-left:6px;padding-right:6px}
input.sm{width:96px;padding:5px 8px}
p.rep{line-height:2.3;max-width:70ch}
.segctl.sm button{padding:4px 9px;font-size:.8rem}
svg .l1{stroke:var(--m,var(--accent))} svg .c1{fill:var(--m,var(--accent))}
svg .l2{stroke:var(--ink);stroke-dasharray:6 4} svg .c2{fill:var(--ink)}
ol.rank{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:r}
ol.rank li{counter-increment:r;display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--bg)}
ol.rank li::before{content:counter(r);font:600 .9rem var(--mono);color:var(--muted);width:1.2em}
ul.notes{margin:0;padding-left:18px;font-size:.85rem;display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto}
.ask{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.arow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:start}
.aq{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.aq .btn{text-align:left;font-weight:500}
.ans{font-size:.88rem;border-left:3px solid var(--m);padding:2px 0 2px 8px}
@media (max-width:560px){.arow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="calc" aria-label="Calcolatrice">
  <div class="row"><b class="grow">Calcolatrice</b><button class="btn ghost small" data-a="calc-toggle" id="calc-close">Chiudi</button></div>
  <input type="text" id="calc-in" inputmode="decimal" autocomplete="off" placeholder="es. (840-720)/720" aria-label="Espressione">
  <div class="out" id="calc-out">&nbsp;</div>
  <div class="keys" id="calc-keys"></div>
</div>
<script>
'use strict';
/* ---------- utilities ---------- */
const R=Math.random, ri=(a,b)=>a+Math.floor(R()*(b-a+1)), pick=a=>a[Math.floor(R()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
const f=(n,d=0)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const cap=s=>s[0].toUpperCase()+s.slice(1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const empty=v=>v==null||v==='';
function parseNum(s){
  if(s==null) return NaN; s=String(s).trim().replace(/[\s%€]/g,''); if(!s) return NaN;
  if(/^-?[1-9]\d{0,2}(,\d{3})+(\.\d+)?$/.test(s)) s=s.replace(/,/g,''); else s=s.replace(',','.');
  return /^-?(\d+\.?\d*|\.\d+)$/.test(s)?parseFloat(s):NaN;
}
const tbl=(h,rows)=>`<div class="tw"><table><thead><tr>${h.map((x,i)=>`<th${i?' class="n"':''}>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>i?`<td class="n">${c}</td>`:`<th scope="row">${c}</th>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function niceStep(max){const raw=max/4||1,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p;return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p}
function barSvg(labels,vals,step){
  step=step||niceStep(Math.max(...vals));const n=Math.max(1,Math.ceil(Math.max(...vals)/step-1e-9)),max=n*step,dec=step<1?(step<.1?2:1):0,W=380,H=200,L=48,B=24,T=10,pw=W-L-8,ph=H-B-T,bw=pw/vals.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:420px" role="img" aria-label="Bar chart">`;
  for(let i=0;i<=n;i++){const v=i*step,y=T+ph-ph*v/max;s+=`<line class="g" x1="${L}" x2="${W-8}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${f(v,dec)}</text>`}
  vals.forEach((v,i)=>{const h=ph*v/max;s+=`<rect class="b" x="${L+i*bw+bw*.2}" y="${T+ph-h}" width="${bw*.6}" height="${h}"/><text x="${L+i*bw+bw/2}" y="${H-7}" text-anchor="middle">${String(labels[i]).split(' ')[0]}</text>`});
  return s+'</svg>';
}
function lineSvg(labels,series){
  const all=series.flatMap(x=>x.v),step=niceStep(Math.max(...all)),n=Math.ceil(Math.max(...all)/step-1e-9),max=n*step,W=380,H=210,L=48,B=40,T=10,pw=W-L-36,ph=H-B-T,x=i=>L+8+pw*i/(labels.length-1),y=v=>T+ph-ph*v/max;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:420px" role="img" aria-label="Line chart">`;
  for(let i=0;i<=n;i++)s+=`<line class="g" x1="${L}" x2="${W-8}" y1="${y(i*step)}" y2="${y(i*step)}"/><text x="${L-6}" y="${y(i*step)+4}" text-anchor="end">${f(i*step)}</text>`;
  labels.forEach((l,i)=>s+=`<text x="${x(i)}" y="${H-24}" text-anchor="middle">${String(l).split(' ')[0]}</text>`);
  series.forEach((se,k)=>{s+=`<polyline fill="none" class="${k?'l2':'l1'}" stroke-width="2.5" points="${se.v.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`+se.v.map((v,i)=>`<circle class="${k?'c2':'c1'}" cx="${x(i)}" cy="${y(v)}" r="3.5"/>`).join('')+`<text x="${L+8+k*150}" y="${H-6}">${k?'– –':'——'} ${se.n}</text>`});
  return s+'</svg>';
}
function pieSvg(labels,vals){
  const tot=vals.reduce((a,b)=>a+b,0),cx=90,cy=95,r=80;let a0=-Math.PI/2,s='<svg viewBox="0 0 380 200" width="100%" style="max-width:420px" role="img" aria-label="Pie chart">';
  vals.forEach((v,i)=>{const a1=a0+2*Math.PI*v/tot,big=a1-a0>Math.PI?1:0;
    s+=`<path class="b" style="opacity:${[1,.62,.34,.18][i%4]}" d="M${cx},${cy} L${cx+r*Math.cos(a0)},${cy+r*Math.sin(a0)} A${r},${r} 0 ${big} 1 ${cx+r*Math.cos(a1)},${cy+r*Math.sin(a1)} Z"/><rect class="b" style="opacity:${[1,.62,.34,.18][i%4]}" x="195" y="${40+i*26}" width="12" height="12"/><text x="214" y="${51+i*26}">${labels[i]} ${f(v/tot*100,1)}%</text>`;a0=a1});
  return s+'</svg>';
}
function chk(q,raw){
  if(empty(raw)) return {ok:false,your:'—'};
  if(q.type==='mc') return {ok:+raw===q.ans,your:q.opts[+raw]};
  const u=parseNum(raw); return {ok:isFinite(u)&&Math.abs(u-q.ans)<=q.tol+1e-9,your:String(raw)};
}
const corr=q=>q.type==='mc'?q.opts[q.ans]:q.show;

/* ---------- mini-case generators (English, like the real test) ---------- */
const SP=['wolves','elk','deer','bison','foxes','hares','lynx'], RG=['North Ridge','East Basin','South Flats','West Canyon','Central Plateau'];
const mcShuffle=(opts,right)=>{const o=shuffle(opts);return{opts:o,ans:o.indexOf(right)}};
const C={
 pct(){const [s,s2,s3]=sample(SP,3),y1=ri(2018,2021),y2=y1+ri(2,4),a=ri(12,95)*10;let k;do{k=ri(60,160)/100}while(Math.abs(k-1)<.06);
  const b=Math.round(a*k/5)*5,ans=(b-a)/a*100,o=()=>[f(ri(10,90)*10),f(ri(10,90)*10)];
  return{tag:'Percentage change',ex:tbl(['Species',y1,y2],shuffle([[cap(s),f(a),f(b)],[cap(s2),...o()],[cap(s3),...o()]])),
   q:`By what percentage did the ${s} population change between ${y1} and ${y2}? Use a minus sign for a decline. Round to one decimal.`,type:'num',unit:'%',ans,tol:.1,show:f(ans,1)+'%',
   why:`(${f(b)} − ${f(a)}) ÷ ${f(a)} = ${f(ans,1)}%. Si divide sempre per il valore iniziale.`}},
 wavg(){const rg=sample(RG,3),n=rg.map(()=>ri(4,30)*10),w=rg.map(()=>ri(180,320)),tot=n.reduce((a,b)=>a+b),ans=n.reduce((a,x,i)=>a+x*w[i],0)/tot;
  return{tag:'Weighted average',ex:tbl(['Region','Elk counted','Avg weight (kg)'],rg.map((r,i)=>[r,f(n[i]),f(w[i])])),
   q:'What is the average weight of an elk across all three regions, in kg? Round to one decimal.',type:'num',unit:'kg',ans,tol:.1,show:f(ans,1)+' kg',
   why:`Media ponderata: (${n.map((x,i)=>`${x}×${w[i]}`).join(' + ')}) ÷ ${f(tot)} = ${f(ans,1)}. La media semplice dei tre pesi sarebbe sbagliata.`}},
 comp(){const P=ri(20,90)*100,r=pick([5,8,10,12,15,20,25]),up=R()<.5,y=pick([2,3]),s=pick(SP),ans=P*Math.pow(1+(up?r:-r)/100,y);
  return{tag:'Compound growth',ex:`<p>A park holds <b>${f(P)}</b> ${s}. The population ${up?'grows':'shrinks'} by <b>${r}%</b> each year.</p>`,
   q:`How many ${s} will there be after ${y} years? Round to the nearest whole number.`,type:'num',ans,tol:Math.max(1,ans*.002),show:f(ans),
   why:`${f(P)} × ${(1+(up?r:-r)/100).toFixed(2)}^${y} = ${f(ans)}. La variazione si compone anno su anno, non si somma.`}},
 share(){const rg=sample(RG,4),n=rg.map(()=>ri(8,60)*10),s=pick(SP),i=ri(0,3),tot=n.reduce((a,b)=>a+b),ans=n[i]/tot*100;
  return{tag:'Share of total',ex:tbl(['Region',cap(s)],rg.map((r,j)=>[r,f(n[j])])),
   q:`What share of the park's ${s} live in ${rg[i]}? Round to one decimal.`,type:'num',unit:'%',ans,tol:.1,show:f(ans,1)+'%',
   why:`${f(n[i])} ÷ ${f(tot)} (totale delle quattro regioni) = ${f(ans,1)}%.`}},
 rev(){const d=pick([10,15,20,25,30,40]),before=ri(20,90)*20,now=before*(1-d/100),s=pick(SP);
  return{tag:'Reverse percentage',ex:`<p>After a harsh winter the ${s} population fell by <b>${d}%</b> and now stands at <b>${f(now)}</b>.</p>`,
   q:`How many ${s} were there before the winter?`,type:'num',ans:before,tol:1,show:f(before),
   why:`${f(now)} ÷ ${(1-d/100).toFixed(2)} = ${f(before)}. Errore tipico: aggiungere il ${d}% al valore attuale.`}},
 brk(){const p=ri(8,20)*10,v=ri(2,6)*10,F=ri(20,90)*500,ans=Math.ceil(F/(p-v));

const ATT=['Permeability','Mobility','Energy'],TR=['Aerobic','Heat-resistant','Light-sensitive','Salt-tolerant'],TRA=['Aer','Heat','Light','Salt'];

function swEval(site,tri){
  const avg=[0,1,2].map(i=>(tri[0].a[i]+tri[1].a[i]+tri[2].a[i])/3),inr=avg.map((v,i)=>inR(site,i,v)),d=tri.some(m=>m.t[site.D]),u=tri.every(m=>!m.t[site.U]);

}
function swBest(site,pool){let best=null;for(let i=0;i<pool.length;i++)for(let j=i+1;j<pool.length;j++)for(let k=j+1;k<pool.length;k++){const t=[pool[i],pool[j],pool[k]],e=swEval(site,t);if(!best||e.score>best.e.score)best={t,e}}return best}

const fitsThis=(s,m)=>[0,1,2].filter(i=>inR(s,i,m.a[i])).length>=2&&!m.t[s.U];
const fitsOther=(o,known,m)=>known.every(i=>inR(o,i,m.a[i]))&&!m.t[o.U];
function genSW(){

  const rnd=()=>({n:name(),a:[ri(1,10),ri(1,10),ri(1,10)],t:TR.map(()=>R()<.4)});
  const sites=[1,2,3].map(n=>{let rng,dist;do{rng=[0,1,2].map(()=>{const lo=ri(1,8);return[lo,lo+2]});dist=rng.map(r=>Math.abs(r[0]+1-5.5)).sort((a,b)=>b-a)}while(dist[0]===dist[1]);
    const [D,U]=sample([0,1,2,3],2),s={name:'Site '+n,rng,D,U,ext:rng.map(r=>Math.abs(r[0]+1-5.5)).indexOf(dist[0])},planted=R()<.75,rounds=[0,1,2,3].map(()=>[rnd(),rnd(),rnd()]),pool=[rnd(),rnd(),rnd(),rnd(),rnd(),rnd()];
    if(planted){const P=[0,1,2].map(i=>({n:name(),a:[],t:TR.map((_,j)=>j===U?false:j===D?i===0:R()<.4)}));
      for(let i=0;i<3;i++){const S=ri(3*rng[i][0],3*rng[i][1]);for(;;){const a=ri(1,10),b=ri(1,10),c=S-a-b;if(c>=1&&c<=10){P[0].a[i]=a;P[1].a[i]=b;P[2].a[i]=c;break}}}
      const pr=sample([0,1,2,3],2);pool[ri(0,5)]=P[0];rounds[pr[0]][ri(0,2)]=P[1];rounds[pr[1]][ri(0,2)]=P[2]}
    s.pool=pool;s.rounds=rounds;s.best=swBestAll(s);return s});
  sites.forEach((s,i)=>{const o=sites[(i+1)%3];s.other=o;s.known=sample([0,1,2],2).sort();
    const craft=(site,idx)=>{const m=rnd();idx.forEach(j=>m.a[j]=ri(site.rng[j][0],site.rng[j][1]));m.t[site.U]=false;return m},set=[];

function genLab(){
  const names=sample(NAMES,4),best=shuffle([0,1,2,3]),skill=names.map((_,r)=>ST.map((_,s)=>s===best[r]?5:ri(1,4))),str=shuffle([0,1,2,3]);
  const pat=()=>{const p=shuffle([0,1,2,3]),d=[];d[p[0]]='high';d[p[1]]='low';d[p[2]]='normal';d[p[3]]='normal';return d};
  const closed=pick([0,3]),rest=shuffle([0,1,2,3].filter(s=>s!==closed)),d2=[];d2[closed]='closed';d2[rest[0]]='high';d2[rest[1]]='normal';d2[rest[2]]='normal';
  const other=r=>pick([0,1,2,3].filter(x=>x!==r)),ev=(k,r,s)=>{const m=other(r),e=SUP[k](names[r],names[m],ST[s??0]);return{...e,k,from:r,o:shuffle(e.o)}};
  const f2=other(str[1]),f3=other(str[2]);
  const days=[
   {goal:'Understand what each researcher needs to do their best work.',dem:pat(),tokens:3,strained:str[0],good:other(str[0]),un:{t:'r',i:other(str[0])},ev:[ev('over',str[0])]},
   {goal:'Make sure every workstation gets what it needs.',dem:d2,tokens:3,strained:str[1],good:other(str[1]),un:{t:'r',i:other(str[1])},notice:`A storm has closed the ${ST[closed]} station for the day. Nobody can work there.`,
    ev:[ev('storm',f2,rest[0]),ev(pick(['conflict','switch','unclear']),str[1],best[other(str[1])])],together:true},
   {goal:'Balance what the team needs with what the workstations need, and finish the project.',dem:pat(),tokens:2,strained:str[2],good:other(str[2]),un:{t:'s',i:ri(0,3)},ev:[ev('over2',str[2]),ev(pick(['data','safety','credit']),f3,ri(0,3))]}];
  return{names,skill,best,days};
}
function labValue(L,d,a,moods){
  const day=L.days[d],w={high:3,normal:2,low:.5},wP=[2,.5,1][d];let v=0;
  for(let s=0;s<4;s++){const mem=[0,1,2,3].filter(r=>a[r]===s).sort((x,y)=>L.skill[y][s]-L.skill[x][s]),dem=day.dem[s];
    if(mem.length>2||(dem==='closed'&&mem.length)) return null;
    if(dem==='closed') continue;
    if(!mem.length){v-={high:12,normal:6,low:0}[dem];continue}
    v+=w[dem]*L.skill[mem[0]][s];
    if(mem[1]!=null) v+=(dem==='high'?w.high*.8:.3)*L.skill[mem[1]][s]; else if(dem==='high') v-=4;}
  for(let r=0;r<4;r++){if(a[r]===L.best[r])v+=1.5*wP;if(moods[r]==='strained'&&day.dem[a[r]]==='high')v-=6+3*wP}
  return v;
}
function labBest(L,d,moods){let best=null,lo=Infinity,hi=-Infinity;
  for(let x=0;x<256;x++){const a=[x&3,(x>>2)&3,(x>>4)&3,(x>>6)&3],v=labValue(L,d,a,moods);if(v==null)continue;if(v>hi){hi=v;best=a}if(v<lo)lo=v}
  return{best,lo,hi};
}

};

/* ---------- engine ---------- */
let tick=null;
const mult=()=>S.timer==='plus'?1.5:1;
function start(mode,opt){S.session={mode,opt,queue:mode==='full'?['redrock','seawolf','sfl']:[mode],idx:0,results:[]};load()}
function load(){const id=S.session.queue[S.session.idx];S.mod=FACT[id](S.session.opt);S.view='brief';render();scrollTo(0,0)}
function begin(){S.view='play';S.t0=Date.now();S.allowed=S.timer==='none'?null:Math.round(META[S.mod.id].min*60*mult());S.confirm=false;S.pt={};S.lastT=S.t0;S.lastL=S.mod.steps[S.mod.ph];S.calcN=0;clearInterval(tick);tick=setInterval(onTick,500);render();scrollTo(0,0)}
function mark(){const now=Date.now();S.pt[S.lastL]=(S.pt[S.lastL]||0)+(now-S.lastT)/1000;S.lastT=now;S.lastL=S.mod.steps[Math.min(S.mod.ph,S.mod.steps.length-1)]}
function elapsed(){return (Date.now()-S.t0)/1000}
function onTick(){const el=document.getElementById('clock');if(!el)return;const e=elapsed();
  if(S.allowed==null){el.textContent=mmss(e);return}
  const rem=S.allowed-e;el.textContent=mmss(rem);el.className='clock'+(rem<60?' crit':rem<300?' warn':'');if(rem<=0)endModule(true)}
function endModule(timedOut){clearInterval(tick);mark();const r=S.mod.result(),m=META[S.mod.id];
  S.session.results.push({id:S.mod.id,name:m.n,c:m.c,...r,score:Math.round(r.score),used:Math.min(elapsed(),S.allowed??1e9),allowed:S.allowed,timedOut,phases:Object.entries(S.pt).filter(x=>x[1]>=1),calcN:S.calcN});
  S.session.idx++;document.getElementById('calc').classList.remove('open');
  if(S.session.idx<S.session.queue.length)load();else finish()}
function finish(){const rs=S.session.results;S.session.overall=Math.round(rs.reduce((a,r)=>a+r.score,0)/rs.length);
  try{const h=hist();h.unshift({d:Date.now(),mode:S.session.mode,o:S.session.overall,t:S.timer,m:rs.map(r=>({id:r.id,s:r.score}))});localStorage.setItem('solve-gym',JSON.stringify(h.slice(0,60)))}catch(e){}
  try{const now=Date.now(),errs=[];rs.forEach(r=>r.rev.filter(x=>!x.ok).forEach(x=>errs.push({d:now,g:r.name,c:r.c,q:x.q,your:x.your,corr:x.corr,why:x.why||'',k:x.k||null,ex:x.ex||''})));
   S.session.saved=errs.length;localStorage.setItem('solve-gym-err',JSON.stringify([...errs,...errList()].slice(0,150)))}catch(e){}
  S.view='results';render();scrollTo(0,0)}
const errList=()=>{try{return JSON.parse(localStorage.getItem('solve-gym-err')||'[]')}catch(e){return[]}};
const hist=()=>{try{return JSON.parse(localStorage.getItem('solve-gym')||'[]')}catch(e){return[]}};
const band=s=>s>=85?['Molto solido','ok']:s>=70?['Buono','ok']:s>=55?['Da consolidare','mid']:['Serve ancora pratica','no'];

/* ---------- views ---------- */
function gameStats(h){const st={};h.forEach(x=>(x.m||(x.mode!=='full'?[{id:x.mode,s:x.o}]:[])).forEach(g=>{const s=st[g.id]=st[g.id]||{n:0,best:0,last:null};s.n++;s.best=Math.max(s.best,g.s);if(s.last==null)s.last=g.s}));return st}
function home(){const h=hist(),st=gameStats(h),lab={full:'Simulazione',redrock:'Redrock',seawolf:'Sea Wolf',sfl:'Futures Lab',drill:'Drill'},cls={full:'',redrock:'m-rr',seawolf:'m-sw',sfl:'m-sf',drill:'m-dr'};
  return `<div class="masthead"><span class="brand">Palestra Solve</span><span class="muted small">Esercizi sempre diversi, in inglese come nel test</span></div>
  <section class="hero"><h1>Allenati sui tre giochi, con il cronometro vero.</h1>
   <p class="lead">Ogni sessione genera dati nuovi. Alla fine ricevi un punteggio per gioco, i tempi per fase, la correzione di ogni risposta e i punti su cui lavorare.</p>
   <div class="track" aria-label="Struttura della simulazione da 95 minuti">
    <div class="seg m-rr" style="flex:35"><b>35′</b><span>Redrock Study</span><small>dati · analisi · report · 6 casi</small></div>
    <div class="seg m-sw" style="flex:30"><b>30′</b><span>Sea Wolf</span><small>3 siti · 4 fasi</small></div>
    <div class="seg m-sf" style="flex:30"><b>30′</b><span>Futures Lab</span><small>3 giornate · team</small></div></div>
   <div class="row"><button class="btn pri big" data-a="start" data-v="full">Avvia la simulazione completa</button>
    <div class="segctl" role="group" aria-label="Cronometro">${[['real','Tempo reale'],['plus','Tempo +50%'],['none','Senza limite']].map(([k,t])=>`<button data-a="timer" data-v="${k}" aria-pressed="${S.timer===k}">${t}</button>`).join('')}</div>
    <div class="segctl" role="group" aria-label="Aiuti">${[[0,'Senza aiuti'],[1,'Con aiuti']].map(([k,t])=>`<button data-a="assist" data-v="${k}" aria-pressed="${!!S.assist===!!k}">${t}</button>`).join('')}</div></div></section>
  <section style="display:flex;flex-direction:column;gap:12px"><h2>Un gioco alla volta</h2><div class="grid">
   ${['redrock','seawolf','sfl','drill'].map(k=>{const s=st[k];return `<div class="card m ${META[k].c}"><span class="tag">${Math.round(META[k].min*mult())} min${S.timer==='none'?' (libero)':''}</span><h3>${META[k].n}</h3><p class="muted small grow">${META[k].d}</p>
     <p class="small n">${s?`ultimo ${s.last} · migliore ${s.best} · ${s.n} prov${s.n>1?'e':'a'}`:'mai provato'}</p><div><button class="btn" data-a="start" data-v="${k}">Inizia</button></div></div>`}).join('')}</div></section>
  ${errSection()}
  <section class="card"><h2>Le tue sessioni</h2>${h.length?`<div class="hist">${h.slice(0,10).map(x=>`<div class="hrow ${cls[x.mode]}"><span>${new Date(x.d).toLocaleDateString('it-IT',{day:'2-digit',month:'short'})} · ${lab[x.mode]}</span><div class="bar"><i style="width:${x.o}%"></i></div><b class="n">${x.o}</b></div>`).join('')}</div><p class="muted small">Salvate solo in questo browser.</p>`
    :'<p class="muted">Ancora nessuna. Dopo la prima sessione qui vedrai l\'andamento dei punteggi.</p>'}</section>
  <footer>Esercizi originali costruiti sui formati descritti dai candidati e dalle guide pubbliche. Non è materiale McKinsey: grafica, contenuti e punteggio del test reale sono diversi, e il punteggio qui serve solo a misurare i tuoi progressi. Durante il test vero si lavora da soli.</footer>`}
function errSection(){const e=errList();if(!e.length)return '';const ks=[...new Set(e.map(x=>x.k).filter(Boolean))],byG={};e.forEach(x=>{(byG[x.g]=byG[x.g]||[]).push(x)});
  return `<section class="card"><div class="row"><h2 class="grow">Errori da rivedere</h2><span class="pill no">${e.length}</span></div>
   <p class="muted small">Ogni risposta sbagliata o lasciata vuota finisce qui, con la soluzione spiegata. Rileggi, poi allenati su casi nuovi dello stesso tipo.</p>
   <div class="row">${ks.length?`<button class="btn pri" data-a="errdrill">Allenati sui tipi che hai sbagliato (${ks.length})</button>`:''}<button class="btn ghost" data-a="errclear">${S.confirmClr?'Confermi? Clicca ancora':'Svuota l\'elenco'}</button></div>
   ${Object.entries(byG).map(([g,xs])=>`<details ${S.openErr===g?'open':''} data-g="${esc(g)}"><summary>${esc(g)} · ${xs.length}</summary><div class="tw"><table><thead><tr><th>Domanda</th><th>Tua risposta</th><th>Corretta</th></tr></thead><tbody>
    ${xs.map(x=>`<tr><td class="wrapc">${x.ex?`<div class="small" style="margin-bottom:6px">${x.ex}</div>`:''}${esc(x.q)}${x.why?`<br><span class="muted small">${esc(x.why)}</span>`:''}<br><span class="muted small">${new Date(x.d).toLocaleDateString('it-IT',{day:'2-digit',month:'short'})}</span></td><td class="wrapc">${esc(x.your)}</td><td class="wrapc"><b>${esc(x.corr)}</b></td></tr>`).join('')}</tbody></table></div></details>`).join('')}</section>`}
function brief(){const m=META[S.mod.id],q=S.session.queue;
  return `<div class="masthead"><span class="brand">Palestra Solve</span>${q.length>1?`<span class="muted small">Gioco ${S.session.idx+1} di ${q.length}</span>`:''}</div>
  <div class="card m ${m.c}" style="max-width:760px"><span class="tag">Tutorial · senza cronometro</span><h1 style="font-size:2.4rem">${m.n}</h1>${S.mod.brief}
   <p class="muted small">${S.timer==='none'?'Nessun limite di tempo: il cronometro conta in avanti.':`Tempo a disposizione: ${Math.round(m.min*mult())} minuti. Parte quando premi il pulsante.`} Aiuti ${S.assist?'attivi':'disattivati'}.</p>
   <div class="row"><button class="btn pri big" data-a="begin">Avvia il cronometro</button><button class="btn ghost" data-a="home">Esci</button></div></div>`}
function play(){const m=META[S.mod.id],mod=S.mod;
  return `<div class="${m.c}" style="display:flex;flex-direction:column;gap:16px"><div class="top">
    <span class="clock" id="clock">${S.allowed==null?mmss(elapsed()):mmss(S.allowed-elapsed())}</span>
    <div class="grow"><b>${m.n}</b><div class="steps">${mod.steps.map((s,i)=>`<span class="${i===mod.ph?'on':i<mod.ph?'done':''}">${s}</span>`).join('')}</div></div>
    <span class="muted small">${mod.hint}</span>
    <button class="btn" data-a="calc-toggle">Calcolatrice</button>
    <button class="btn" data-a="quit">${S.confirm?'Confermi? Clicca ancora':'Consegna ora'}</button></div>
   ${mod.render()}</div>`}
function results(){const s=S.session,[bt,bc]=band(s.overall);
  return `<div class="masthead"><span class="brand">Palestra Solve</span><span class="muted small">Valutazione</span></div>
  <section class="row" style="align-items:flex-end;gap:24px"><div class="score">${s.overall}<small> / 100</small></div>
   <div style="display:flex;flex-direction:column;gap:8px;max-width:52ch"><span><span class="pill ${bc}">${bt}</span></span>
    <p class="muted small">Soglie di questa palestra, non di McKinsey: 85+ molto solido, 70–84 buono, 55–69 da consolidare. Usale per confrontare le tue sessioni tra loro.</p></div></section>
  ${s.results.map(r=>{const [t,c]=band(r.score);return `<section class="card m ${r.c}"><div class="row"><h2 class="grow">${r.name}</h2><span class="pill ${c}">${t}</span><b class="n" style="font-size:1.5rem">${r.score}</b></div>
   <p class="muted small">Tempo usato ${mmss(r.used)}${r.allowed?` su ${mmss(r.allowed)}`:''}${r.timedOut?' · <span class="pill no">tempo scaduto</span>':''}${r.phases.length>1?`<br>${r.phases.map(p=>`${p[0]} ${mmss(p[1])}`).join(' · ')}`:''}${r.id==='redrock'||r.id==='drill'?`<br>Calcoli fatti con la calcolatrice integrata: ${r.calcN}`:''}</p>
   ${r.brk.map(b=>`<div class="brk"><span>${b[0]}</span><div class="bar"><i style="width:${b[2]?b[1]/b[2]*100:0}%"></i></div><span class="n">${Math.round(b[1])} / ${b[2]}</span></div>`).join('')}
   ${r.tips.length?`<h3>Su cosa lavorare</h3><ul class="tips">${r.tips.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
   <details><summary>Correzione risposta per risposta (${r.rev.filter(x=>x.ok).length} / ${r.rev.length})</summary><div class="tw"><table><thead><tr><th>Domanda</th><th>Tua risposta</th><th>Corretta</th><th></th></tr></thead><tbody>
    ${r.rev.map(x=>`<tr><td class="wrapc">${esc(x.q)}${x.why?`<br><span class="muted small">${esc(x.why)}</span>`:''}</td><td class="wrapc">${esc(x.your)}</td><td class="wrapc">${esc(x.corr)}</td><td><span class="pill ${x.ok?'ok':'no'}">${x.ok?'ok':'no'}</span></td></tr>`).join('')}</tbody></table></div></details></section>`}).join('')}
  ${s.saved?`<p class="note">Ho salvato ${s.saved} risposte sbagliate in <b>Errori da rivedere</b>, nella home.</p>`:''}
  <div class="row"><button class="btn pri" data-a="start" data-v="${s.mode}">Rifai con dati nuovi</button><button class="btn" data-a="home">Torna alla home</button></div>`}
function render(){document.getElementById('app').innerHTML=({home,brief,play,results})[S.view]()}

/* ---------- calculator ---------- */
function calcEval(s){s=s.replace(/\s/g,'').replace(/,/g,'.').replace(/×/g,'*').replace(/÷/g,'/');let i=0;
  const num=()=>{if(s[i]==='('){i++;const v=expr();if(s[i]!==')')throw 0;i++;return pct(v)}if(s[i]==='-'){i++;return -pw()}const st=i;while(/[\d.]/.test(s[i]||''))i++;if(st===i)throw 0;return pct(parseFloat(s.slice(st,i)))},
   pct=v=>{if(s[i]==='%'){i++;return v/100}return v},pw=()=>{const v=num();if(s[i]==='^'){i++;return Math.pow(v,pw())}return v},
   term=()=>{let v=pw();while(s[i]==='*'||s[i]==='/'){const o=s[i++],n=pw();v=o==='*'?v*n:v/n}return v},
   expr=()=>{let v=term();while(s[i]==='+'||s[i]==='-'){const o=s[i++],n=term();v=o==='+'?v+n:v-n}return v};
  const v=expr();if(i<s.length||!isFinite(v))throw 0;return v}
function calcRun(){const inp=document.getElementById('calc-in'),out=document.getElementById('calc-out');try{const v=calcEval(inp.value);out.textContent=String(+v.toPrecision(12));S.calcAns=v;S.calcN=(S.calcN||0)+1}catch(e){out.textContent='Espressione non valida'}}

/* ---------- events ---------- */
function onAct(el){const a=el.dataset.a,d=el.dataset;
  if(a==='calc-toggle'){const c=document.getElementById('calc');c.classList.toggle('open');if(c.classList.contains('open'))document.getElementById('calc-in').focus();return}
  if(a==='key'){const inp=document.getElementById('calc-in'),k=d.v;if(k==='=')calcRun();else if(k==='C'){inp.value='';document.getElementById('calc-out').innerHTML='&nbsp;'}else if(k==='⌫')inp.value=inp.value.slice(0,-1);else if(k==='Ans')inp.value+=S.calcAns!=null?String(+S.calcAns.toPrecision(12)):'';else inp.value+=k;return}
  if(a==='timer'){S.timer=d.v;return render()}
  if(a==='assist'){S.assist=d.v==='1';return render()}
  if(a==='start')return start(d.v);
  if(a==='errdrill')return start('drill',[...new Set(errList().map(x=>x.k).filter(k=>k&&C[k]))]);
  if(a==='errclear'){if(!S.confirmClr){S.confirmClr=true;return render()}S.confirmClr=false;try{localStorage.removeItem('solve-gym-err')}catch(e){}return render()}
  if(a==='home'){clearInterval(tick);S.view='home';return render()}
  if(a==='begin')return begin();
  if(a==='quit'){if(!S.confirm){S.confirm=true;return render()}return endModule(false)}
  if(S.view!=='play')return;
  S.confirm=false;
  if(a==='set'){S.mod.vals[d.k]=d.v;return render()}
  const r=S.mod.act(a,d);if(r==='end')return endModule(false);mark();render();
  if(a==='next-case'){const i=document.getElementById('in-case');i&&i.focus()}
  if(a==='ph'||a==='sw-next'||a==='lab-next'||a==='treat'||a==='ob-done')scrollTo(0,0);
}
if(typeof document!=='undefined'){
  document.getElementById('calc-keys').innerHTML=['7','8','9','/','4','5','6','*','1','2','3','-','0','.','%','+','(',')','^','⌫','C','Ans','='].map(k=>`<button data-a="key" data-v="${k}"${k==='='?' style="grid-column:span 2"':''}>${k}</button>`).join('');
  document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&!el.disabled)onAct(el)});
  document.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details[data-g]')&&e.target.open)S.openErr=e.target.dataset.g},true);
  document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.bind;if(k&&S.mod){S.mod.vals[k]=e.target.value;if(S.view==='play'&&(k==='ct'||k==='cd'))render()}});
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.id==='calc-in'){calcRun();return}
    if(e.key==='Enter'&&e.target.id==='in-case'){const b=document.querySelector('[data-a="next-case"]');b&&onAct(b);return}
    if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr[data-a]')){e.preventDefault();onAct(e.target)}});
  render();
}
if(typeof module!=='undefined')module.exports={C,genCases,genStudy,genSW,swEval,swBest,fitsThis,fitsOther,genLab,labValue,labBest,parseNum,calcEval,chk,FACT,META,S,ATT,TR,ST};
</script>
</body>
